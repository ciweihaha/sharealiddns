name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  shell:
    name: Shell syntax + ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Syntax check (sh and bash)
        run: |
          set -eu
          find myscripts -type f \( -name '*.sh' -o -name '*.lib' \) | sort > /tmp/shell_scripts.txt
          cat /tmp/shell_scripts.txt
          while IFS= read -r f; do
            echo "checking $f"
            sh -n "$f"
            bash -n "$f"
          done < /tmp/shell_scripts.txt

      # apt 的 ShellCheck 停在 0.10.0，改用上游官方预编译包 0.11.0（2025-08-03，
      # 迄今最新稳定版；该 release 未附校验文件，故用版本固定 URL + --version 断言）
      - name: Install ShellCheck 0.11.0
        run: |
          set -eu
          curl -sSL --max-time 120 -o /tmp/shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          tar -xf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 0755 /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version

      - name: ShellCheck (errors only)
        run: |
          # NOTE: these router scripts use `[ "$v" -ge 0 2>/dev/null ]`, valid
          # POSIX sh (the redirect applies to the `[` builtin) that ShellCheck
          # cannot parse (SC1072/SC1073). `sh -n` above is the authoritative
          # syntax gate; those two codes are excluded here so that genuine
          # ShellCheck errors still fail the build.
          find myscripts -type f \( -name '*.sh' -o -name '*.lib' \) -print0 \
            | sort -z | xargs -0 shellcheck --severity=error --exclude=SC1072,SC1073

      - name: Shell unit + stress tests
        run: bash tests/test_shell.sh
